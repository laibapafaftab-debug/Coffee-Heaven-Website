<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Heaven</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f7f3ef; color: #333; text-align: center; }
        header { background-color: #3e2723; color: white; padding: 20px 0; }
        header h1 { font-size: 2rem; }

        .hero {
            position: relative;
            padding: 90px 20px;
            color: white;
            background:
                linear-gradient(rgba(46, 27, 20, 0.75), rgba(46, 27, 20, 0.75)),
                url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
        }
        .hero h2 { font-size: 2.5rem; margin-bottom: 10px; }
        .hero p { font-size: 1.05rem; opacity: 0.9; }

        .menu { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; padding: 50px 20px; }
        .card {
            background: white; border-radius: 12px; overflow: hidden; width: 260px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12); text-align: left;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,0.18); }
        .card img { width: 100%; height: 160px; object-fit: cover; display: block; }
        .card-body { padding: 18px 20px; text-align: center; }
        .card h3 { color: #3e2723; margin-bottom: 8px; font-size: 1.15rem; }
        .card p { color: #6b5d55; font-size: 0.92rem; line-height: 1.5; }

        footer { background: #3e2723; color: white; padding: 15px; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>☕ Coffee Heaven</h1>
    </header>

    <section class="hero">
        <h2>Freshly Brewed Happiness</h2>
        <p>Experience the finest coffee in town.</p>
    </section>

    <section class="menu">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&w=600&q=80" alt="Espresso shot">
            <div class="card-body">
                <h3>Espresso</h3>
                <p>Rich and bold single shot.</p>
            </div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1572442388796-11668ba67e53?auto=format&fit=crop&w=600&q=80" alt="Cappuccino with latte art">
            <div class="card-body">
                <h3>Cappuccino</h3>
                <p>Espresso with steamed milk foam.</p>
            </div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=600&q=80" alt="Latte with heart art">
            <div class="card-body">
                <h3>Latte</h3>
                <p>Smooth espresso with velvety milk.</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Coffee Heaven. All rights reserved.</p>
    </footer>
</body>
</html>
