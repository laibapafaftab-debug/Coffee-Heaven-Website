<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Heaven</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f7f3ef; color: #333; text-align: center; }
        header { background-color: #3e2723; color: white; padding: 20px 0; }
        header h1 { font-size: 2rem; }
        .hero { padding: 60px 20px; background: #5d4037; color: white; }
        .hero h2 { font-size: 2.5rem; margin-bottom: 10px; }
        .menu { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 40px 20px; }
        .card { background: white; border-radius: 10px; padding: 20px; width: 220px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card h3 { color: #3e2723; margin-bottom: 10px; }
        footer { background: #3e2723; color: white; padding: 15px; margin-top: 40px; }
    </style>
</head>
<body>
    <header>
        <h1>☕ Coffee Heaven</h1>
    </header>
    <section class="hero">
        <h2>Freshly Brewed Happiness</h2>
        <p>Experience the finest coffee in town.</p>
    </section>
    <section class="menu">
        <div class="card">
            <h3>Espresso</h3>
            <p>Rich and bold single shot.</p>
        </div>
        <div class="card">
            <h3>Cappuccino</h3>
            <p>Espresso with steamed milk foam.</p>
        </div>
        <div class="card">
            <h3>Latte</h3>
            <p>Smooth espresso with velvety milk.</p>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 Coffee Heaven. All rights reserved.</p>
    </footer>
</body>
</html>
